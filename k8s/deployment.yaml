apiVersion: apps/v1
kind: Deployment
metadata:
  name: sodep-finance
  labels:
    app: sodep-finance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sodep-finance
  template:
    metadata:
      labels:
        app: sodep-finance
    spec:
      containers:
        - name: frontend
          image: sodep-finance:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: sodep-finance-config
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
