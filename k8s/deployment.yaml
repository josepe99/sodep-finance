apiVersion: apps/v1
kind: Deployment
metadata:
  name: sodep-finance
  labels:
    app: sodep-finance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sodep-finance
  template:
    metadata:
      labels:
        app: sodep-finance
    spec:
      containers:
        - name: frontend
          image: sodep-finance:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: sodep-finance-config
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
      securityContext:
        fsGroup: 1000
